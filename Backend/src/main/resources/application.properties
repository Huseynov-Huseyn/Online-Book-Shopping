spring.application.name=aztu-staj
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookshop}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
server.port=${SERVER_PORT:8080}
app.upload.images-path=${APP_UPLOAD_IMAGES_PATH:../statics/images/}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}
jwt.secret=${JWT_SECRET:aztu-staj-dev-only-secret-key-change-before-production-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}