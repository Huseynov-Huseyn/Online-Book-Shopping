<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | BookShop</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .admin-table th, .admin-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
        .admin-table th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.8rem; }
        .admin-table tr:hover { background: rgba(255, 255, 255, 0.02); }
        
        /* Modal Styles */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 2000; display: none; }
        .modal-content { background: var(--bg-card); width: 90%; max-width: 600px; margin: 50px auto; padding: 40px; border-radius: var(--radius-lg); border: 1px solid var(--border); position: relative; }
        .modal-close { position: absolute; top: 20px; right: 20px; font-size: 24px; cursor: pointer; color: var(--text-muted); }
    </style>
</head>

<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">Book<span>Shop</span></a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">📚 Kataloq</a></li>
                    <li><a href="addbook.html">➕ Əlavə Et</a></li>
                    <li><a href="admin.html" class="active">⚙️ Admin</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button id="theme-toggle">🌙</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="stats-grid fade-in" style="margin-bottom: 40px;">
            <div class="stat-card">
                <i class="fas fa-book" style="color: var(--primary); font-size: 1.5rem; margin-bottom: 10px;"></i>
                <span class="stat-label">Bazada Cəmi Kitab</span>
                <span class="stat-value" id="total-books">0</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-server" style="color: var(--success); font-size: 1.5rem; margin-bottom: 10px;"></i>
                <span class="stat-label">Sistem Statusu</span>
                <div id="status" class="status" style="margin: 0; padding: 5px 15px; font-size: 0.8rem;">Yoxlanılır...</div>
            </div>
        </div>

        <div class="panel fade-in">
            <div class="section-title">
                <i class="fas fa-tools" style="color: var(--primary)"></i> Kitabların İdarəedilməsi
            </div>

            <div class="controls" style="margin-bottom: 30px;">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="admin-search" placeholder="Axtarış..." onkeyup="adminSearchBooks()">
                </div>
                <select id="admin-category-filter" onchange="adminSearchBooks()">
                    <option value="">Bütün Kateqoriyalar</option>
                    <option value="Bədii">🎨 Bədii</option>
                    <option value="Elmi">🔬 Elmi</option>
                    <option value="Tarix">📖 Tarix</option>
                    <option value="Dedektiv">🔍 Dedektiv</option>
                </select>
                <button class="btn btn-secondary" onclick="loadAdminBooks()">📋 Yenilə</button>
            </div>

            <div id="admin-books-container">
                <!-- Admin table will be injected here -->
            </div>
        </div>
    </main>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
            <div class="section-title" style="font-size: 1.5rem;">✏️ Kitabı Redaktə Et</div>
            
            <form id="admin-edit-form">
                <input type="hidden" id="edit-book-id">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Kitabın Adı</label>
                        <input type="text" id="edit-title" required>
                    </div>
                    <div class="input-group">
                        <label>Müəllif</label>
                        <input type="text" id="edit-author" required>
                    </div>
                    <div class="input-group">
                        <label>Kateqoriya</label>
                        <select id="edit-category" required>
                            <option value="Bədii">Bədii</option>
                            <option value="Elmi">Elmi</option>
                            <option value="Tarix">Tarix</option>
                            <option value="Dedektiv">Dedektiv</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Səhifə</label>
                        <input type="number" id="edit-pages" required>
                    </div>
                    <div class="input-group">
                        <label>İl</label>
                        <input type="number" id="edit-year" required>
                    </div>
                    <div class="input-group">
                        <label>Qiymət</label>
                        <input type="number" id="edit-price" step="0.01" required>
                    </div>
                </div>

                <div style="margin-top: 25px; display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Yadda Saxla</button>
                    <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeEditModal()">Ləğv Et</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Admin Panel | Premium Management</p>
    </footer>

    <script src="function.js"></script>
    <script>
        // Additional Admin Logic
        async function loadAdminBooks() {
            const container = document.getElementById('admin-books-container');
            if (!container) return;
            container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            
            try {
                const books = await apiRequest(`${API_URL}/all`);
                document.getElementById('total-books').textContent = books.length;
                renderAdminTable(books);
            } catch (error) {
                container.innerHTML = '<div class="empty">Xəta baş verdi</div>';
            }
        }

        function renderAdminTable(books) {
            const container = document.getElementById('admin-books-container');
            if (!container) return;
            
            if (books.length === 0) {
                container.innerHTML = '<div class="empty">📚 Heç bir kitab tapılmadı</div>';
                return;
            }

            container.innerHTML = `
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Şəkil</th>
                            <th>Kitab</th>
                            <th>Müəllif</th>
                            <th>Kateqoriya</th>
                            <th>Qiymət</th>
                            <th>Əməliyyat</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${books.map(book => `
                            <tr>
                                <td><img src="${getImageUrl(book.imageUrl)}" style="width: 40px; border-radius: 4px;" onerror="handleImageError(this)"></td>
                                <td><strong>${escapeHtml(book.title)}</strong></td>
                                <td>${escapeHtml(book.author)}</td>
                                <td><span class="badge">${book.category}</span></td>
                                <td>${book.price.toFixed(2)} ₼</td>
                                <td>
                                    <button class="btn btn-secondary" onclick='openEditModal(${JSON.stringify(book)})'>✏️</button>
                                    <button class="btn btn-secondary" style="color: var(--danger)" onclick="deleteAdminBook('${book.id}')">🗑️</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function adminSearchBooks() {
            const search = document.getElementById('admin-search').value.toLowerCase();
            const category = document.getElementById('admin-category-filter').value;
            
            try {
                const allBooks = await apiRequest(`${API_URL}/all`);
                const filtered = allBooks.filter(book => {
                    const matchesSearch = book.title.toLowerCase().includes(search) || book.author.toLowerCase().includes(search);
                    const matchesCategory = !category || book.category === category;
                    return matchesSearch && matchesCategory;
                });
                renderAdminTable(filtered);
            } catch (error) {
                console.error('Search failed', error);
            }
        }

        async function deleteAdminBook(id) {
            if (!confirm('Silmək istədiyinizdən əminsiniz?')) return;
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    showToast('Kitab silindi', 'success');
                    loadAdminBooks();
                }
            } catch (error) {
                showToast('Xəta baş verdi', 'danger');
            }
        }

        document.getElementById('admin-edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-book-id').value;
            const data = {
                title: document.getElementById('edit-title').value,
                author: document.getElementById('edit-author').value,
                category: document.getElementById('edit-category').value,
                pages: parseInt(document.getElementById('edit-pages').value),
                year: parseInt(document.getElementById('edit-year').value),
                price: parseFloat(document.getElementById('edit-price').value)
            };
            
            const result = await updateAdminBook(id, data);
            if (result.success) {
                closeEditModal();
                loadAdminBooks();
            }
        });

        // Re-run init if needed or just call loadAdminBooks
        window.onload = () => {
            if (typeof loadAdminBooks === 'function') loadAdminBooks();
        };
    </script>
</body>

</html>
